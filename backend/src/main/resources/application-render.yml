# ============================================================
# CareerSetu Render Production Profile
# ============================================================
# Designed specifically for deployment on Render.com:
# - Dynamic port binding ($PORT)
# - Support for Render Managed PostgreSQL (auto-normalized)
# - Graceful fallback to H2 if no database is attached
# - Excludes RabbitMQ & Redis for lean, zero-crash cloud operation
# - Configures Actuator health checks for Render liveness probes
# ============================================================

server:
  port: ${PORT:10000}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

spring:
  # Standalone session & simple in-memory cache for cloud container
  session:
    store-type: none

  cache:
    type: simple

  # JPA / Hibernate configuration for production PostgreSQL
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Flyway database migrations (disabled in favor of Hibernate ddl-auto and DevDataSeeder)
  flyway:
    enabled: false

  # Disable components not running on Render Free tier
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ── Health & Monitoring ─────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    mail:
      enabled: false

# ── CareerSetu App Configuration ─────────────────────────────
careersetu:
  jwt:
    secret: ${JWT_SECRET:careersetu-production-jwt-signing-secret-key-render-deployment-must-be-at-least-512-bits-long-2024}
    access-token-expiry-minutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:60}
    refresh-token-expiry-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:7}

  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8000}
    internal-secret: ${AI_SERVICE_INTERNAL_SECRET:render-internal-secret}
    enabled: ${FEATURE_AI_ENABLED:true}
    timeout-seconds: 30

  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*.onrender.com,http://localhost:5173,http://localhost:3000}
    rate-limit:
      requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
      auth-requests-per-minute: 20

  features:
    mfa-enabled: false
    keycloak-enabled: false
    antiscam-enabled: true
    rag-enabled: false

logging:
  level:
    in.careersetu: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
