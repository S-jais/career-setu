# ============================================================
# CareerSetu Infrastructure as Code — Render Blueprint Spec
# ============================================================
# Docs: https://render.com/docs/blueprint-spec
# Deployment:
# 1. Push this repository to GitHub
# 2. Go to Render Dashboard -> "Blueprints" -> "New Blueprint Instance"
# 3. Select this repo -> Render will automatically provision the database & services!
# ============================================================

version: "1"

services:
  # ── 1. Spring Boot Core Backend (Java 21) ───────────────────
  - type: web
    name: careersetu-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: DATABASE_URL
        fromDatabase:
          name: careersetu-db
          property: connectionString
      - key: FEATURE_AI_ENABLED
        value: "true"

  # ── 2. FastAPI AI Service (Python 3.11) ─────────────────────
  - type: web
    name: careersetu-ai
    runtime: python
    rootDir: ai-service
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  # ── Render Managed PostgreSQL Database (Free Tier) ─────────
  - name: careersetu-db
    databaseName: careersetu
    user: careersetu_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"
