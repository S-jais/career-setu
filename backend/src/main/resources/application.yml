# ============================================================
# CareerSetu Backend Configuration
# ============================================================
spring:
  application:
    name: careersetu-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}

  # ── Database ──────────────────────────────────────────────
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/careersetu}
    username: ${DATABASE_USER:careersetu_user}
    password: ${DATABASE_PASSWORD:dev_password_change_me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # ── Flyway Migrations ────────────────────────────────────
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ── Redis ─────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:dev_redis_change_me}
      timeout: 3000

  session:
    store-type: redis
    timeout: 30m

  # ── Mail ──────────────────────────────────────────────────
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  # ── RabbitMQ ─────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:careersetu}
    password: ${RABBITMQ_PASSWORD:dev_rabbitmq_change_me}

  # ── Security ─────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/careersetu}

  # ── Jackson ──────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# ── Server ────────────────────────────────────────────────
server:
  port: ${SPRING_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# ── Actuator ──────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 0.1

# ── OpenAPI ───────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  default-produces-media-type: application/json

# ── Application-specific ──────────────────────────────────
careersetu:
  jwt:
    secret: ${JWT_SECRET:careersetu-super-secure-jwt-signing-secret-key-for-local-dev-must-be-at-least-512-bits-long-2024}
    access-token-expiry-minutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:15}
    refresh-token-expiry-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:7}

  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8000}
    internal-secret: ${AI_SERVICE_INTERNAL_SECRET:dev-internal-secret}
    enabled: ${FEATURE_AI_ENABLED:true}
    timeout-seconds: 30

  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minio_dev_access}
    secret-key: ${S3_SECRET_KEY:minio_dev_secret}
    bucket-documents: ${S3_BUCKET_DOCUMENTS:careersetu-documents}
    bucket-avatars: ${S3_BUCKET_AVATARS:careersetu-avatars}
    region: ${S3_REGION:ap-south-1}
    signed-url-expiry-hours: 1

  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    rate-limit:
      requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:60}
      auth-requests-per-minute: 10
    upload:
      max-size-mb: ${MAX_FILE_UPLOAD_SIZE_MB:10}
      allowed-types: ${ALLOWED_FILE_TYPES:pdf,docx,txt,jpg,jpeg,png}

  email:
    from-email: ${SMTP_FROM_EMAIL:noreply@careersetu.in}
    from-name: ${SMTP_FROM_NAME:CareerSetu}

  features:
    keycloak-enabled: ${FEATURE_KEYCLOAK_ENABLED:false}
    mfa-enabled: ${FEATURE_MFA_ENABLED:true}
    antiscam-enabled: ${FEATURE_ANTISCAM_ENABLED:true}
    rag-enabled: ${FEATURE_RAG_ENABLED:false}

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    in.careersetu: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"
