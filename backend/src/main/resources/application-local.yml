# ============================================================
# CareerSetu Local Development Profile (Standalone / In-Memory)
# ============================================================
spring:
  datasource:
    url: jdbc:h2:mem:careersetu;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: false

  session:
    store-type: none

  cache:
    type: simple

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

server:
  port: 8080

management:
  health:
    mail:
      enabled: false

careersetu:
  ai:
    service-url: http://localhost:8000
    enabled: true
  features:
    mfa-enabled: false
    keycloak-enabled: false
    antiscam-enabled: true
    rag-enabled: false
